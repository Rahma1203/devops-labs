
services:
    web:
       build:
          context: .
          dockerfile: Dockerfile
       image: devops-network-lab:1.0

       container_name: network-lab

       ports:
         - "127.0.0.1:8080:8080"

       read_only: true


       cap_drop:
         - ALL

       security_opt:
          - no-new-privileges:true

       pids_limit: 100

       restart: unless-stopped
